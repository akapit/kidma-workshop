<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בחירת פלטה לדף</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  body { background: #ECEAE6; }
  .page-head { padding: 2rem 1rem 1rem; }
  .page-head h1 { color: #000; font-size: clamp(2rem, 5vw, 3rem); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); gap: 1.5rem; max-width: 80rem; margin: 0 auto; padding: 0 1rem 3rem; }
  .opt { background: var(--bg-base); border-radius: 10px; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.15); }
  .opt section { padding: 1.5rem 1rem; }
  .opt h2 { font-size: 1.9rem; margin-bottom: .5rem; }
  .opt .btn { font-size: 1.25rem; padding: .6rem 1.4rem; }
  .label { padding: 1rem; background: #fff; color: #000; border-top: 1px solid #ddd; }
  .label b { font-size: 1.5rem; display: block; }
  .swatch { display: flex; justify-content: center; gap: .4rem; margin-top: .5rem; }
  .swatch i { width: 2rem; height: 2rem; border-radius: 4px; border: 1px solid #0003; }
</style>
</head>
<body>
<div class="page-head"><h1>איזו פלטה מתאימה לעסק?</h1><p class="small">כל כרטיס מראה איך ייראו ראש הדף, חלק באמצע והכפתור. אפשר גם צבעים משלכם.</p></div>
<div class="grid" id="grid"></div>
<script>
  const OPTS = [
    ['premium', 'א. פרימיום וסמכותי', 'ייעוץ, שירות לעסקים, הצעה יקרה'],
    ['royal', 'ב. נועז וחגיגי', 'לייף סטייל, יופי, קהל נשי צעיר'],
    ['calm', 'ג. רגוע ומקצועי', 'טיפול, בריאות, הורות, קהל מבוגר'],
    ['energy', 'ד. אנרגטי', 'כושר, ספורט, שינוי מהיר'],
  ];
  document.getElementById('grid').innerHTML = OPTS.map(([k, name, fit]) => `
    <article class="opt" data-palette="${k}">
      <section class="s-dark"><h2>ככה תיראה הכותרת שלכם</h2><p>משפט אחד שמסביר מה מקבלים</p><a class="btn" href="#">הכפתור שלכם</a></section>
      <section class="s-tint"><p class="lead">חלק באמצע הדף</p><ul class="list"><li>נקודה ראשונה</li><li>נקודה שנייה</li></ul></section>
      <section class="s-base"><h2>כותרת על רקע בהיר</h2><a class="btn" href="#">הכפתור שלכם</a></section>
      <div class="label"><b>${name}</b>${fit}
        <div class="swatch">${['--bg-dark','--accent','--cta','--bg-tint','--bg-soft'].map(v => `<i style="background:var(${v})"></i>`).join('')}</div>
      </div>
    </article>`).join('');
</script>
</body>
</html>
